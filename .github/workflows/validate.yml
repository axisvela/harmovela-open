name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate ecosystem registry and examples
        run: node scripts/validate-registry.mjs
